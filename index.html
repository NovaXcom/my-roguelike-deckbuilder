<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14110f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="2人パーティ × スキル・クールダウン × ブレイク＆チェインのローグライクRPG" />
    <title>オリジナル・パーティローグRPG</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231e1b18'/%3E%3Cpath d='M18 46 46 18M38 18h8v8' stroke='%2300f2fe' stroke-width='6' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='20' cy='44' r='5' fill='%23d64545'/%3E%3C/svg%3E" />
    <style>
      html, body {
        margin: 0; height: 100%; background: #14110f; overflow: hidden;
        overscroll-behavior: none; /* プル・トゥ・リフレッシュ/バウンス防止 */
        touch-action: none; /* ブラウザのパン/ピンチズームを無効化しゲーム側で処理 */
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; touch-action: none; }
      /* スマホの縦持ち: 横向きを案内（タッチ端末のみ。PCのウィンドウ形状では出さない） */
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10; background: #14110f; color: #f6e3b4;
        flex-direction: column; align-items: center; justify-content: center; gap: 24px;
        font: bold 20px/1.5 "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; text-align: center;
      }
      #rotate .phone {
        width: 56px; height: 96px; border: 5px solid #00f2fe; border-radius: 12px; position: relative;
        animation: turn 2.4s ease-in-out infinite;
      }
      #rotate .phone::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 14px; height: 4px; margin-left: -7px; background: #00f2fe; border-radius: 2px; }
      @keyframes turn { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div class="phone"></div><div>端末を横向きにしてください<br /><small style="font-weight: normal; opacity: 0.7">Please rotate your device</small></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
